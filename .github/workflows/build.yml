name: Build and Verify

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Repository contents:"
          ls -la
          echo "Build verification complete."
